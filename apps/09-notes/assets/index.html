<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNO Q — Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="login" class="login" hidden>
      <form id="login-form" class="login__card">
        <h2>Notes</h2>
        <p>This board is password protected.</p>
        <input
          id="login-password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          aria-label="Password"
        />
        <button type="submit">Unlock</button>
        <span id="login-error" class="login__error" hidden>Wrong password.</span>
      </form>
    </div>

    <main id="app" hidden>
      <header>
        <h1>Notes</h1>
        <div class="header-right">
          <span id="status" class="status status--down">connecting…</span>
          <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings" title="Settings">⚙</button>
        </div>
      </header>

      <div id="banner" class="banner" hidden></div>

      <section id="settings" class="settings" hidden>
        <h2>Notion sync</h2>
        <p id="notion-status" class="settings__status"></p>
        <label class="settings__row">
          <span>Sync notes to Notion</span>
          <input type="checkbox" id="sync-toggle" />
        </label>
        <label class="settings__row">
          <span>Every</span>
          <select id="sync-interval">
            <option value="5">5 minutes</option>
            <option value="10">10 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">60 minutes</option>
          </select>
        </label>
        <label class="settings__row">
          <span>Add each note as</span>
          <select id="sync-type">
            <option value="note">📝 Note</option>
            <option value="reminder">⏰ Reminder</option>
          </select>
        </label>
        <div class="settings__row settings__row--actions">
          <button id="sync-now-btn" class="btn-small" type="button">Sync now</button>
          <span id="sync-status" class="settings__meta"></span>
        </div>
      </section>

      <section class="composer">
        <textarea
          id="note-input"
          rows="4"
          placeholder="Write a note… (⌘/Ctrl+Enter to save)"
          aria-label="New note"
        ></textarea>
        <div class="composer__row">
          <span class="hint">Runs a local model on the board — no cloud.</span>
          <button id="save-btn" type="button">Save note</button>
        </div>
      </section>

      <section>
        <ul id="notes" class="notes"></ul>
        <p id="empty" class="empty">No notes yet. Write your first one above.</p>
      </section>

      <footer>
        <p>Stored on the board in SQLite · summarised on the QRB2210 · nothing leaves the device.</p>
      </footer>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="webui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
